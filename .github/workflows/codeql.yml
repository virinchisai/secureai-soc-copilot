name: CodeQL

on:
  push:
    branches: [main, codex/secureai-soc-copilot]
  pull_request:
    branches: [main, codex/secureai-soc-copilot]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python
      - uses: github/codeql-action/analyze@v4
